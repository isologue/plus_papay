services:
  mysql:
    image: mysql:8.4
    container_name: plus-papay-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${DB_NAME:-plus_papay}
      MYSQL_USER: ${MYSQL_APP_USER:-papay}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change_me_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  # FlareSolverr 仅供可选的 Cloudflare 自动校验诊断使用；不暴露到宿主机端口。
  # 需要启用时设置 OPENAI_FLARESOLVERR=1，注册器仍使用与主浏览器相同的代理出口。
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    shm_size: 1gb
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-warning}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plus-papay-app
    restart: unless-stopped
    init: true
    shm_size: 1gb
    # 容器内没有宿主机 X Server；HEADFUL=1 时用 Xvfb 提供虚拟显示器，
    # Playwright 仍以有头模式运行并可正常截图。
    command: >-
      sh -c 'if [ "$${HEADFUL}" = "1" ]; then
      Xvfb "$${DISPLAY:-:99}" -screen 0 1280x720x24 -ac -nolisten tcp >/tmp/xvfb.log 2>&1 &
      fi; exec npm start'
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DISPLAY: ${DISPLAY:-:99}
      NODE_ENV: production
      PORT: 3000
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-15mb}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_APP_USER:-papay}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change_me_app_password}
      DB_NAME: ${DB_NAME:-plus_papay}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-60}
      ASSET_LOCK_STALE_MS: ${ASSET_LOCK_STALE_MS:-900000}
      HEADFUL: ${HEADFUL:-0}
      # 1 = 排查 OpenAI 登录链路时输出脱敏网络状态（不输出 Cookie、邮箱、Token、代理）
      OPENAI_NETWORK_DEBUG: ${OPENAI_NETWORK_DEBUG:-0}
      # 1 = 遇到不稳定 HTTP 代理时，强制 Chromium 使用 HTTP/1.1（仅注册器）
      OPENAI_FORCE_HTTP1: ${OPENAI_FORCE_HTTP1:-0}
      # 可选 FlareSolverr 预热。默认只诊断，Cookie 注入须显式开启。
      OPENAI_FLARESOLVERR: ${OPENAI_FLARESOLVERR:-0}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191}
      FLARESOLVERR_TIMEOUT_SEC: ${FLARESOLVERR_TIMEOUT_SEC:-60}
      OPENAI_FLARESOLVERR_APPLY_COOKIES: ${OPENAI_FLARESOLVERR_APPLY_COOKIES:-0}
      CHROMIUM_CHANNEL: ${CHROMIUM_CHANNEL:-}
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CHATGPT_TOKEN: ${CHATGPT_TOKEN:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      BILLING_COUNTRY: ${BILLING_COUNTRY:-US}
      BILLING_ADDRESS: ${BILLING_ADDRESS:-}
      BILLING_CITY: ${BILLING_CITY:-}
      BILLING_STATE: ${BILLING_STATE:-}
      BILLING_ZIP: ${BILLING_ZIP:-}
      BILLING_NAME: ${BILLING_NAME:-}
      BILLING_EMAIL: ${BILLING_EMAIL:-}
      BILLING_PHONE: ${BILLING_PHONE:-}
      PAYPAL_PASSWORD: ${PAYPAL_PASSWORD:-}
      CARD_NUMBER: ${CARD_NUMBER:-}
      CARD_EXPIRY: ${CARD_EXPIRY:-}
      CARD_CVC: ${CARD_CVC:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      PROXY: ${PROXY:-}
      EMAIL_SOURCE: ${EMAIL_SOURCE:-}
      INBOX_JWT: ${INBOX_JWT:-}
      INBOX_API_BASE: ${INBOX_API_BASE:-}
      INBOX_EMAIL_DOMAINS: ${INBOX_EMAIL_DOMAINS:-}
      RANDOM_EMAIL_DOMAIN: ${RANDOM_EMAIL_DOMAIN:-}
      IMAP_ADMIN_PASSWORD: ${IMAP_ADMIN_PASSWORD:-}
    volumes:
      - ./product_files:/app/product_files
      - ./debug_screenshots:/app/debug_screenshots

volumes:
  mysql_data:
